<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F0EB" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F2F0EB'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23111111'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="[Artist Name] — photographer, filmmaker and visual storyteller. Selected photography, film and visual stories shaped by people, places and moments."
    />
    <title>Sagar Dad — Photographer &amp; Filmmaker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://videos.pexels.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Hero image: preloaded with the exact srcset used by the <img>, so the LCP asset starts early. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesizes="100vw"
      imagesrcset="https://images.pexels.com/photos/13258166/pexels-photo-13258166.jpeg?auto=compress&cs=tinysrgb&w=640 640w, https://images.pexels.com/photos/13258166/pexels-photo-13258166.jpeg?auto=compress&cs=tinysrgb&w=960 960w, https://images.pexels.com/photos/13258166/pexels-photo-13258166.jpeg?auto=compress&cs=tinysrgb&w=1280 1280w, https://images.pexels.com/photos/13258166/pexels-photo-13258166.jpeg?auto=compress&cs=tinysrgb&w=1600 1600w, https://images.pexels.com/photos/13258166/pexels-photo-13258166.jpeg?auto=compress&cs=tinysrgb&w=1920 1920w, https://images.pexels.com/photos/13258166/pexels-photo-13258166.jpeg?auto=compress&cs=tinysrgb&w=2400 2400w"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
